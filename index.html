<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery demo</title><style>body{font:16px system-ui;max-width:640px;margin:60px auto;padding:24px;background:#090a10;color:#e7e9ef}input,button{padding:12px;border-radius:6px;border:1px solid #373b48;background:#20242e;color:inherit}li{padding:12px 0}#error{color:#ff9b9b}</style><main><h1>Demo tasks</h1><p>A small project for the delivery pilot.</p><form id="task-form"><label for="title">Task title</label><input id="title" minlength="3" maxlength="160" required><button>Add task</button></form><p id="error" role="alert"></p><ul id="tasks"></ul></main><script>const api='http://localhost:4100';async function load(){try{const res=await fetch(api+'/tasks');if(!res.ok)throw Error('Unable to load tasks');const data=await res.json();document.querySelector('#tasks').replaceChildren(...data.map(t=>{const li=document.createElement('li');li.textContent=t.title;return li}));}catch(e){document.querySelector('#error').textContent=e.message}}document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#title');try{const res=await fetch(api+'/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:input.value})});if(!res.ok)throw Error((await res.json()).error);input.value='';await load()}catch(e){document.querySelector('#error').textContent=e.message}};load();</script></html>
