<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery demo</title>
  <style>
    body{font:16px system-ui;max-width:640px;margin:60px auto;padding:24px;background:#090a10;color:#e7e9ef}
    input,select,button{padding:12px;border-radius:6px;border:1px solid #373b48;background:#20242e;color:inherit}
    form,.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    li{padding:12px 0}
    #error{color:#ff9b9b}
  </style>
</head>
<body>
  <main>
    <h1>Demo tasks</h1>
    <p>A small project for the delivery pilot.</p>
    <form id="task-form">
      <label for="title">Task title</label>
      <input id="title" minlength="3" maxlength="160" required>
      <label for="priority">Priority</label>
      <select id="priority">
        <option value="low">Low</option>
        <option value="normal" selected>Normal</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add task</button>
    </form>
    <p id="error" role="alert" aria-live="polite"></p>
    <div class="filters">
      <label for="priority-filter">Show tasks</label>
      <select id="priority-filter">
        <option value="all" selected>All priorities</option>
        <option value="low">Low priority</option>
        <option value="normal">Normal priority</option>
        <option value="high">High priority</option>
      </select>
    </div>
    <ul id="tasks"></ul>
  </main>
  <script type="module">
    import { initTaskUI } from './app.mjs';
    initTaskUI();
  </script>
</body>
</html>
